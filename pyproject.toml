[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metavyn"
version = "0.1.0"
description = "Drift-aware, severity-routed adaptation for humanitarian demand forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
torch = ["torch>=2.0"]

[project.scripts]
metavyn = "metavyn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
